<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IELTS Speaking Part 1 · Q2 &amp; Q3 互动教学课件</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }
    .hotword {
      background: linear-gradient(120deg, #e0e7ff 0%, #ede9fe 100%);
      color: #4338ca;
      border-bottom: 2px dashed #6366f1;
      padding: 1px 6px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.18s ease;
      display: inline-block;
    }
    .hotword:hover, .hotword.active {
      background: #4f46e5;
      color: #ffffff;
      border-bottom-color: transparent;
      transform: translateY(-1px);
    }
    .blur-mask {
      filter: blur(7px);
      user-select: none;
      transition: filter 0.25s ease;
    }
    .teach-lg {
      font-size: 1.15rem;
      line-height: 1.85;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <!-- Top Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold text-sm shrink-0 shadow-sm">
          P1
        </div>
        <div class="min-w-0">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="text-xs font-semibold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full">IELTS Speaking Part 1</span>
            <span class="text-xs text-slate-500">Chatting with friends</span>
          </div>
          <!-- Separate Question Switcher -->
          <div class="flex items-center gap-1.5 mt-1 flex-wrap" id="question-tabs">
            <!-- Populated by JS -->
          </div>
        </div>
      </div>

      <!-- Mode Switch, Accent Default & Sound -->
      <div class="flex items-center gap-2 flex-wrap">
        <div class="inline-flex rounded-xl bg-slate-100 p-1 border border-slate-200" role="group" aria-label="默认口音">
          <button id="btn-accent-uk" type="button" class="px-2.5 py-1 rounded-lg text-xs font-semibold transition-all">🇬🇧 英音</button>
          <button id="btn-accent-us" type="button" class="px-2.5 py-1 rounded-lg text-xs font-semibold transition-all">🇺🇸 美音</button>
        </div>

        <div class="inline-flex rounded-xl bg-slate-100 p-1 border border-slate-200" role="group" aria-label="教学模式切换">
          <button id="btn-mode-teach" type="button" class="px-3 py-1 rounded-lg text-xs sm:text-sm font-semibold transition-all flex items-center gap-1.5">
            <i data-lucide="presentation" class="w-4 h-4"></i>
            <span>授课模式</span>
          </button>
          <button id="btn-mode-study" type="button" class="px-3 py-1 rounded-lg text-xs sm:text-sm font-semibold transition-all flex items-center gap-1.5">
            <i data-lucide="book-open" class="w-4 h-4"></i>
            <span>自学模式</span>
          </button>
        </div>

        <button id="btn-sound-toggle" type="button" title="计时提示音开关" class="p-2 rounded-xl border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 transition-colors">
          <i id="icon-sound" data-lucide="volume-2" class="w-4 h-4"></i>
        </button>
      </div>
    </div>

    <!-- Top 3-Section Single-View Switcher -->
    <div class="border-t border-slate-100 bg-slate-50/90">
      <div class="max-w-5xl mx-auto px-4 sm:px-6 py-2 flex items-center gap-2 overflow-x-auto" id="section-tabs">
        <button type="button" data-view="lesson" id="tab-view-lesson" class="shrink-0 px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all flex items-center gap-1.5">
          <span>📝 答题思路与范句</span>
        </button>
        <button type="button" data-view="pronunciation" id="tab-view-pronunciation" class="shrink-0 px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all flex items-center gap-1.5">
          <span>🔊 本课核心词 · 英美发音对比</span>
        </button>
        <button type="button" data-view="vocab" id="tab-view-vocab" class="shrink-0 px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all flex items-center gap-1.5">
          <span>✨ 词汇精讲 &amp; 记忆彩蛋</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Single-Screen Workspace -->
  <main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 py-6 space-y-5" id="main-workspace">
    <!-- Persistent Question Banner -->
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 sm:p-6">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div class="space-y-1.5">
          <div class="flex items-center gap-2 flex-wrap">
            <span id="q-badge" class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-indigo-100 text-indigo-700">Q2</span>
            <span id="mode-pill" class="text-xs text-slate-400"></span>
          </div>
          <h2 id="q-title" class="text-xl sm:text-2xl font-extrabold text-slate-900 tracking-tight"></h2>
          <div class="flex items-center gap-2 flex-wrap pt-0.5">
            <span class="text-xs text-slate-500">Please think about your answer in 10s · Within 15–30s</span>
            <button id="btn-q-uk" type="button" class="px-2.5 py-0.5 rounded-md bg-slate-100 hover:bg-indigo-100 text-slate-700 hover:text-indigo-700 text-xs font-semibold transition-colors">🇬🇧 朗读题目</button>
            <button id="btn-q-us" type="button" class="px-2.5 py-0.5 rounded-md bg-slate-100 hover:bg-rose-100 text-slate-700 hover:text-rose-700 text-xs font-semibold transition-colors">🇺🇸 朗读题目</button>
          </div>
        </div>

        <!-- Interactive Timer Box -->
        <div class="bg-slate-900 text-white rounded-2xl p-3.5 sm:p-4 min-w-[230px] shrink-0 shadow-md">
          <div class="flex items-center justify-between gap-3 mb-2">
            <span id="timer-phase-label" class="text-xs font-semibold uppercase tracking-wider text-indigo-300">准备就绪</span>
            <span id="timer-display" class="text-2xl font-extrabold tabular-nums">00:10</span>
          </div>
          <div class="w-full bg-slate-700 rounded-full h-1.5 mb-3 overflow-hidden">
            <div id="timer-progress" class="bg-indigo-400 h-1.5 rounded-full transition-all duration-300" style="width: 0%"></div>
          </div>
          <div class="flex items-center gap-1.5">
            <button id="btn-start-think" type="button" class="flex-1 bg-indigo-500 hover:bg-indigo-400 text-white text-xs font-semibold py-1.5 px-2.5 rounded-lg transition-colors">
              10s 构思
            </button>
            <button id="btn-start-speak" type="button" class="flex-1 bg-emerald-500 hover:bg-emerald-400 text-white text-xs font-semibold py-1.5 px-2.5 rounded-lg transition-colors">
              30s 作答
            </button>
            <button id="btn-timer-reset" type="button" title="重置计时" class="p-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 transition-colors">
              <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- VIEW 1: 答题思路与范句 -->
    <section id="view-lesson" class="space-y-5">
      <!-- Idea Switcher Pills -->
      <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-3.5 sm:p-4 flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-2 flex-wrap" id="idea-pills">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- Formula Step 1 & Step 2 Cards (with PPT Auxiliary Images) -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 flex flex-col justify-between gap-3">
          <div class="space-y-2.5">
            <div class="flex items-center justify-between gap-2">
              <span id="step1-badge" class="inline-flex items-center gap-1.5 text-xs font-bold text-indigo-700 bg-indigo-50 px-2.5 py-1 rounded-lg">
                ① 思路切入
              </span>
              <button id="btn-toggle-step1" type="button" class="text-xs font-semibold text-indigo-600 hover:text-indigo-800 flex items-center gap-1">
                <i data-lucide="eye" class="w-3.5 h-3.5"></i>
                <span id="label-toggle-step1">揭晓英文</span>
              </button>
            </div>
            <p id="step1-cn" class="text-sm font-medium text-slate-700 leading-relaxed"></p>

          </div>
          <div class="bg-slate-50 border border-slate-200/80 rounded-xl p-3.5">
            <div id="step1-en" class="text-slate-900 font-semibold leading-relaxed"></div>
          </div>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 flex flex-col justify-between gap-3">
          <div class="space-y-2.5">
            <div class="flex items-center justify-between gap-2">
              <span id="step2-badge" class="inline-flex items-center gap-1.5 text-xs font-bold text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-lg">
                ② 展开细节
              </span>
              <button id="btn-toggle-step2" type="button" class="text-xs font-semibold text-emerald-600 hover:text-emerald-800 flex items-center gap-1">
                <i data-lucide="eye" class="w-3.5 h-3.5"></i>
                <span id="label-toggle-step2">揭晓英文</span>
              </button>
            </div>
            <p id="step2-cn" class="text-sm font-medium text-slate-700 leading-relaxed"></p>

          </div>
          <div class="bg-slate-50 border border-slate-200/80 rounded-xl p-3.5">
            <div id="step2-en" class="text-slate-900 font-semibold leading-relaxed"></div>
          </div>
        </div>
      </div>

      <!-- Full Synthesized Answer Card -->
      <div class="bg-white rounded-2xl border-2 border-indigo-100 shadow-sm p-5 sm:p-6">
        <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold uppercase tracking-wider text-indigo-600">P1 完整参考回答</span>
            <span id="full-answer-tag" class="text-xs px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 font-medium"></span>
          </div>
          <div class="flex items-center gap-1.5 flex-wrap">
            <button id="btn-toggle-all" type="button" class="px-3 py-1.5 rounded-lg text-xs font-semibold border border-slate-200 text-slate-700 hover:bg-slate-50 transition-colors flex items-center gap-1.5">
              <i data-lucide="eye" class="w-3.5 h-3.5"></i>
              <span id="label-toggle-all">全部显示</span>
            </button>
            <button id="btn-speak-uk" type="button" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 hover:bg-indigo-700 text-white transition-colors flex items-center gap-1">
              <span>🇬🇧</span>
              <span>英音朗读</span>
            </button>
            <button id="btn-speak-us" type="button" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-rose-600 hover:bg-rose-700 text-white transition-colors flex items-center gap-1">
              <span>🇺🇸</span>
              <span>美音朗读</span>
            </button>
          </div>
        </div>

        <div id="full-answer-text" class="text-slate-900 font-medium leading-relaxed text-base sm:text-lg p-4 rounded-xl bg-slate-50 border border-slate-200/80">
          <!-- Populated by JS -->
        </div>

        <p class="mt-2.5 text-xs text-slate-500 flex items-center gap-1.5">
          <i data-lucide="mouse-pointer-click" class="w-3.5 h-3.5 text-indigo-500 shrink-0"></i>
          <span>点击句中<strong>紫色高亮词组</strong>，可直接跳转至“✨ 词汇精讲 &amp; 记忆彩蛋”查看对应解析与配图。</span>
        </p>
      </div>
    </section>

    <!-- VIEW 2: 本课核心词 · 英美发音对比 -->
    <section id="view-pronunciation" class="hidden bg-white rounded-2xl border border-slate-200 shadow-sm p-5 sm:p-6 space-y-4">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2">
          <span class="w-7 h-7 rounded-lg bg-amber-100 text-amber-700 flex items-center justify-center text-xs font-bold">音</span>
          <div>
            <h3 class="text-base font-bold text-slate-900" id="pron-heading">本课核心词 · 英美发音对比</h3>
            <p class="text-xs text-slate-500">点击 🇬🇧 或 🇺🇸 按钮对比英式与美式发音差异</p>
          </div>
        </div>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="pronunciation-chips">
        <!-- Populated by JS -->
      </div>
    </section>

    <!-- VIEW 3: 词汇精讲 & 记忆彩蛋 -->
    <section id="view-vocab" class="hidden bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
      <div class="px-5 py-3.5 bg-slate-900 text-white flex items-center justify-between">
        <div class="flex items-center gap-2">
          <i data-lucide="sparkles" class="w-4 h-4 text-indigo-300"></i>
          <h3 class="text-sm font-bold" id="vocab-heading">词汇精讲 &amp; 记忆彩蛋</h3>
        </div>
        <span class="text-xs text-slate-300" id="vocab-count-badge"></span>
      </div>

      <div class="px-5 py-3 border-b border-slate-100 bg-slate-50 flex flex-wrap gap-2" id="vocab-pill-list">
        <!-- Populated by JS -->
      </div>

      <div class="p-5 sm:p-6" id="vocab-detail-panel">
        <!-- Populated by JS -->
      </div>
    </section>
  </main>

    // --- Audio & Dual-Accent Speech ---
    let audioCtx = null;
    function playChime(freq = 660, duration = 0.18) {
      if (!state.soundOn) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function speakText(text, accentOverride) {
      if (!('speechSynthesis' in window)) return;
      const accent = accentOverride || state.accent;
      const targetLang = accent === 'uk' ? 'en-GB' : 'en-US';
      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = targetLang;
        const voices = window.speechSynthesis.getVoices();
        const matched = voices.find(v => v.lang && v.lang.toLowerCase().startsWith(targetLang.toLowerCase()));
        if (matched) utter.voice = matched;
        utter.rate = 0.94;
        window.speechSynthesis.speak(utter);
      } catch (e) {}
    }
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

          `
        });
      }
      if (v.senses && v.senses.length) {
        const activeSense = v.senses[state.activeSenseIdx] || v.senses[0];
        blocks.push({
          label: '一词多义 & 例句',
          html: `
            <div class="space-y-2.5 pt-3 border-t border-slate-100">
              <div class="flex flex-wrap gap-1.5">
                ${v.senses.map((s, idx) => `
                  <button type="button" data-sense="${idx}" class="px-2.5 py-1 rounded-lg text-xs font-semibold transition-all ${
                    idx === state.activeSenseIdx
                      ? 'bg-indigo-100 text-indigo-800 border border-indigo-200'
                      : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                  }">${s.label}</button>
                `).join('')}
              </div>
              <div class="bg-slate-50 rounded-xl p-3.5 border border-slate-200/70 space-y-1.5">
                <p class="text-xs sm:text-sm text-slate-600 leading-relaxed">${activeSense.usage}</p>
                <ul class="space-y-1">
                  ${activeSense.examples.map(ex => `<li class="text-xs sm:text-sm font-medium text-slate-800">• ${ex}</li>`).join('')}
                </ul>
              </div>
            </div>
          `
        });
      }
      return blocks;
    }

    function renderVocabDetail() {
      const v = VOCAB_BANK[state.activeVocab];
      const panel = document.getElementById('vocab-detail-panel');
      if (!v) return;

      const blocks = getVocabBlocks(v);
      const hasImg = Boolean(v.img);
      const totalSteps = blocks.length + (hasImg ? 1 : 0);
      const step = Math.min(state.vocabRevealStep, totalSteps);

      // Image appears FIRST (Step 1) when present
      const imgShown = hasImg && step >= 1;
      const textStepsShown = hasImg ? Math.max(0, step - 1) : step;

      let nextLabel = '已全部显示';
      if (step < totalSteps) {
        if (hasImg && step === 0) {
          nextLabel = `点击显示下一步：记忆配图 (1/${totalSteps})`;
        } else {
          const nextBlock = blocks[textStepsShown];
          nextLabel = `点击显示下一步：${nextBlock.label} (${step + 1}/${totalSteps})`;
        }
      }

      const revealedHtml = blocks.slice(0, textStepsShown).map(b => b.html).join('');

      const imgHtml = hasImg ? (
        imgShown ? `
          <div class="rounded-2xl overflow-hidden border border-slate-200 bg-white p-3 w-full h-full min-h-[260px] flex items-center justify-center">
            <img src="${v.img}" alt="${v.term} 记忆配图" class="max-w-full max-h-[380px] w-auto h-auto object-contain rounded-xl" />
          </div>
        ` : `
          <button type="button" data-vocab-next="1" class="w-full h-full min-h-[260px] rounded-2xl border-2 border-dashed border-indigo-200 bg-indigo-50/30 hover:bg-indigo-50/70 hover:border-indigo-300 transition-all flex flex-col items-center justify-center gap-2 text-indigo-500">
            <i data-lucide="image" class="w-8 h-8"></i>
            <span class="text-xs sm:text-sm font-semibold">点击先显示记忆配图</span>
          </button>
        `
      ) : '';

      panel.innerHTML = `
        <div class="space-y-4">
          <!-- Step Control Bar (PPT Animation Style) -->
          <div class="flex flex-wrap items-center justify-between gap-2 bg-slate-50 px-3.5 py-2.5 rounded-xl border border-slate-200/80">
            <div class="flex items-center gap-2">
              <span class="text-xs font-bold text-slate-700">讲义分步展示：</span>
              <span class="text-xs font-semibold text-indigo-600">${step} / ${totalSteps}</span>
            </div>
            <div class="flex items-center gap-2">
              ${step < totalSteps ? `
                <button type="button" data-vocab-next="1" class="px-3.5 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold transition-colors shadow-sm">
                  ${nextLabel} →
                </button>
              ` : ''}
              <button type="button" data-vocab-all="${step < totalSteps ? '1' : '0'}" class="px-2.5 py-1.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-100 text-slate-600 text-xs font-semibold transition-colors">
                ${step < totalSteps ? '全部显示' : '重置隐藏'}
              </button>
            </div>
          </div>

          <div class="grid grid-cols-1 ${v.img ? 'md:grid-cols-12' : ''} gap-5 items-stretch">
            <div class="${v.img ? 'md:col-span-7' : ''} space-y-3.5">
              <div class="flex items-start justify-between gap-2">
                <div>
                  <h4 class="text-xl font-extrabold text-slate-900">${v.term}</h4>
                  <span class="inline-block mt-1 text-xs px-2.5 py-0.5 rounded-md bg-slate-100 text-slate-600 font-medium">${v.pos}</span>
                </div>
                <div class="flex items-center gap-1.5 shrink-0">
                  <button type="button" data-speak="${v.term}" data-accent="uk" class="px-3 py-1.5 rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-semibold transition-colors">🇬🇧 英</button>
                  <button type="button" data-speak="${v.term}" data-accent="us" class="px-3 py-1.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-semibold transition-colors">🇺🇸 美</button>
                </div>
              </div>

              <div class="flex flex-wrap gap-x-4 gap-y-1 text-xs sm:text-sm font-mono bg-slate-50 px-3 py-2 rounded-lg border border-slate-200/70">
                <span class="text-indigo-700">🇬🇧 ${v.ukIpa}</span>
                <span class="text-rose-700">🇺🇸 ${v.usIpa}</span>
              </div>

              ${revealedHtml || `
                <button type="button" data-vocab-next="1" class="w-full py-5 rounded-xl border-2 border-dashed border-slate-200 bg-slate-50 hover:bg-indigo-50/40 hover:border-indigo-200 text-slate-500 hover:text-indigo-600 text-xs sm:text-sm font-semibold transition-all">
                  ${hasImg && step === 0 ? '👆 点击右侧配图或上方按钮，先看图联想，再逐条揭晓释义' : '👆 点击继续显示释义与拓展'}
                </button>
              `}
            </div>
            ${v.img ? `<div class="md:col-span-5 flex">${imgHtml}</div>` : ''}
          </div>
        </div>
      `;
    }

    function renderAll() {
      const isTeach = state.mode === 'teach';
      document.getElementById('btn-mode-teach').className = `px-3 py-1 rounded-lg text-xs sm:text-sm font-semibold transition-all flex items-center gap-1.5 ${
        isTeach ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-600 hover:text-slate-900'
      }`;
      document.getElementById('btn-mode-study').className = `px-3 py-1 rounded-lg text-xs sm:text-sm font-semibold transition-all flex items-center gap-1.5 ${
        !isTeach ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-600 hover:text-slate-900'
      }`;

      document.getElementById('btn-accent-uk').className = `px-2.5 py-1 rounded-lg text-xs font-semibold transition-all ${
        state.accent === 'uk' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-600 hover:text-slate-900'
      }`;
      document.getElementById('btn-accent-us').className = `px-2.5 py-1 rounded-lg text-xs font-semibold transition-all ${
        state.accent === 'us' ? 'bg-white text-rose-700 shadow-sm' : 'text-slate-600 hover:text-slate-900'
      }`;

      document.getElementById('mode-pill').textContent = isTeach ? '· 授课模式（英文默认遮罩）' : '· 自学模式（全展开）';

      renderQuestionTabs();

      // Top 3 View Tabs & Single-Screen Switching
      ['lesson', 'pronunciation', 'vocab'].forEach(v => {
        const tab = document.getElementById(`tab-view-${v}`);
        const sec = document.getElementById(`view-${v}`);
        const active = state.activeView === v;
        tab.className = `shrink-0 px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all flex items-center gap-1.5 ${
          active
            ? 'bg-indigo-600 text-white shadow-sm'
            : 'bg-white text-slate-700 border border-slate-200 hover:bg-slate-100'
        }`;
        if (active) {
          sec.classList.remove('hidden');
        } else {
          sec.classList.add('hidden');
        }
      });

      const qObj = getQuestionObj();
      document.getElementById('q-badge').textContent = qObj.id;
      document.getElementById('q-title').textContent = qObj.text;

      // Lesson Content
      const lesson = LESSON_DATA[state.activeQ];
      document.getElementById('idea-pills').innerHTML = lesson.ideas.map((idea, idx) => {
        const active = idx === state.activeIdeaIdx;
        return `
          <button type="button" data-idea="${idx}" class="px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-semibold border transition-all ${
            active
              ? 'bg-indigo-50 border-indigo-300 text-indigo-900 shadow-sm'
              : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'
          }">${idea.label}</button>
        `;
      }).join('');

      const c = getActiveIdea();
      document.getElementById('step1-badge').textContent = c.step1Badge;
      document.getElementById('step1-cn').textContent = c.step1Cn;
      document.getElementById('step2-badge').textContent = c.step2Badge;
      document.getElementById('step2-cn').textContent = c.step2Cn;
      document.getElementById('full-answer-tag').textContent = c.tag;



      const s1El = document.getElementById('step1-en');
      const s2El = document.getElementById('step2-en');
      const fullEl = document.getElementById('full-answer-text');

      s1El.innerHTML = renderTokens(c.step1En);
      s2El.innerHTML = renderTokens(c.step2En);
      fullEl.innerHTML = renderTokens(c.step1En) + ' ' + renderTokens(c.step2En);

      const show1 = state.mode === 'study' || state.revealStep1;
      const show2 = state.mode === 'study' || state.revealStep2;
      const showFull = show1 && show2;

      s1El.className = `text-slate-900 font-semibold leading-relaxed ${isTeach ? 'teach-lg' : 'text-sm sm:text-base'} ${show1 ? '' : 'blur-mask'}`;
      s2El.className = `text-slate-900 font-semibold leading-relaxed ${isTeach ? 'teach-lg' : 'text-sm sm:text-base'} ${show2 ? '' : 'blur-mask'}`;
      fullEl.className = `text-slate-900 font-medium leading-relaxed p-4 rounded-xl bg-slate-50 border border-slate-200/80 ${isTeach ? 'teach-lg' : 'text-base sm:text-lg'} ${showFull ? '' : 'blur-mask'}`;

      document.getElementById('label-toggle-step1').textContent = show1 ? '隐藏英文' : '揭晓英文';
      document.getElementById('label-toggle-step2').textContent = show2 ? '隐藏英文' : '揭晓英文';
      document.getElementById('label-toggle-all').textContent = showFull ? '全部隐藏' : '全部显示';

      renderPronunciation();
      renderVocabPills();
      renderVocabDetail();
      if (window.lucide) window.lucide.createIcons();
    }

    // --- Timer Logic ---
    function updateTimerUI() {
      const m = String(Math.floor(state.timer.secondsLeft / 60)).padStart(2, '0');
      const s = String(state.timer.secondsLeft % 60).padStart(2, '0');
      document.getElementById('timer-display').textContent = `${m}:${s}`;
      const pct = state.timer.total > 0 ? ((state.timer.total - state.timer.secondsLeft) / state.timer.total) * 100 : 0;
      document.getElementById('timer-progress').style.width = `${Math.min(100, Math.max(0, pct))}%`;

      const labelEl = document.getElementById('timer-phase-label');
      if (state.timer.phase === 'think') {
        labelEl.textContent = '审题构思中 (10s)';
        labelEl.className = 'text-xs font-semibold uppercase tracking-wider text-indigo-300';
      } else if (state.timer.phase === 'speak') {
        const elapsed = state.timer.total - state.timer.secondsLeft;
        labelEl.textContent = elapsed >= 15 ? '答题中 · 已达15s基准线 ✓' : '口语作答中 (目标15-30s)';
        labelEl.className = 'text-xs font-semibold uppercase tracking-wider text-emerald-300';
      } else {
        labelEl.textContent = '准备就绪';
        labelEl.className = 'text-xs font-semibold uppercase tracking-wider text-slate-400';
      }
    }

    function stopTimer() {
      if (state.timer.intervalId) {
        clearInterval(state.timer.intervalId);
        state.timer.intervalId = null;
      }
    }

    function startTimerPhase(phase) {
      stopTimer();
      state.timer.phase = phase;
      state.timer.total = phase === 'think' ? 10 : 30;
      state.timer.secondsLeft = state.timer.total;
      playChime(phase === 'think' ? 520 : 740, 0.16);
      updateTimerUI();

      state.timer.intervalId = setInterval(() => {
        state.timer.secondsLeft -= 1;
        if (state.timer.secondsLeft <= 0) {
          if (state.timer.phase === 'think') {
            startTimerPhase('speak');
            return;
          } else {
            stopTimer();
            state.timer.phase = 'idle';
            state.timer.secondsLeft = 0;
            playChime(880, 0.25);
          }
        }
        updateTimerUI();
      }, 1000);
    }

    // --- Event Listeners ---
    document.getElementById('btn-mode-teach').addEventListener('click', () => {
      state.mode = 'teach';
      state.revealStep1 = false;
      state.revealStep2 = false;
      state.vocabRevealStep = 0;
      renderAll();
    });
    document.getElementById('btn-mode-study').addEventListener('click', () => {
      state.mode = 'study';
      state.vocabRevealStep = 99;
      renderAll();
    });

    document.getElementById('btn-accent-uk').addEventListener('click', () => {
      state.accent = 'uk';
      renderAll();
    });
    document.getElementById('btn-accent-us').addEventListener('click', () => {
      state.accent = 'us';
      renderAll();
    });

    document.getElementById('btn-sound-toggle').addEventListener('click', () => {
      state.soundOn = !state.soundOn;
      document.getElementById('icon-sound').setAttribute('data-lucide', state.soundOn ? 'volume-2' : 'volume-x');
      if (window.lucide) window.lucide.createIcons();
    });

    document.getElementById('question-tabs').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-qid]');
      if (!btn) return;
      state.activeQ = btn.dataset.qid;
      state.activeIdeaIdx = 0;
      state.revealStep1 = false;
      state.revealStep2 = false;
      state.activeVocab = state.activeQ === 'Q2' ? 'trending_news' : 'be_inclined';
      state.activeSenseIdx = 0;
      state.vocabRevealStep = state.mode === 'study' ? 99 : 0;
      renderAll();
    });

    document.getElementById('section-tabs').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-view]');
      if (!btn) return;
      state.activeView = btn.dataset.view;
      renderAll();
    });

    document.getElementById('idea-pills').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-idea]');
      if (!btn) return;
      state.activeIdeaIdx = Number(btn.dataset.idea);
      state.revealStep1 = false;
      state.revealStep2 = false;
      state.vocabRevealStep = 0;
      renderAll();
    });

    document.getElementById('btn-toggle-step1').addEventListener('click', () => {
      state.revealStep1 = !state.revealStep1;
      renderAll();
    });
    document.getElementById('btn-toggle-step2').addEventListener('click', () => {
      state.revealStep2 = !state.revealStep2;
      renderAll();
    });
    document.getElementById('btn-toggle-all').addEventListener('click', () => {
      const next = !(state.revealStep1 && state.revealStep2);
      state.revealStep1 = next;
      state.revealStep2 = next;
      renderAll();
    });

    document.getElementById('btn-q-uk').addEventListener('click', () => speakText(getQuestionObj().text, 'uk'));
    document.getElementById('btn-q-us').addEventListener('click', () => speakText(getQuestionObj().text, 'us'));

    document.getElementById('btn-speak-uk').addEventListener('click', () => speakText(getActiveIdea().plain, 'uk'));
    document.getElementById('btn-speak-us').addEventListener('click', () => speakText(getActiveIdea().plain, 'us'));

    document.getElementById('btn-start-think').addEventListener('click', () => startTimerPhase('think'));
    document.getElementById('btn-start-speak').addEventListener('click', () => startTimerPhase('speak'));
    document.getElementById('btn-timer-reset').addEventListener('click', () => {
      stopTimer();
      state.timer.phase = 'idle';
      state.timer.total = 10;
      state.timer.secondsLeft = 10;
      updateTimerUI();
    });

    document.getElementById('main-workspace').addEventListener('click', (e) => {
      const hwBtn = e.target.closest('button[data-hw]');
      if (hwBtn) {
        state.activeVocab = hwBtn.dataset.hw;
        state.activeSenseIdx = 0;
      state.vocabRevealStep = state.mode === 'study' ? 99 : 0;
        state.activeView = 'vocab';
        renderAll();
        return;
      }
      const speakBtn = e.target.closest('button[data-speak]');
      if (speakBtn) {
        speakText(speakBtn.dataset.speak, speakBtn.dataset.accent);
      }
    });

    document.getElementById('vocab-pill-list').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-vocab]');
      if (!btn) return;
      state.activeVocab = btn.dataset.vocab;
      state.activeSenseIdx = 0;
      state.vocabRevealStep = state.mode === 'study' ? 99 : 0;
      renderAll();
    });

    document.getElementById('vocab-detail-panel').addEventListener('click', (e) => {
      const nextBtn = e.target.closest('button[data-vocab-next]');
      if (nextBtn) {
        state.vocabRevealStep += 1;
        renderVocabDetail();
        if (window.lucide) window.lucide.createIcons();
        return;
      }
      const allBtn = e.target.closest('button[data-vocab-all]');
      if (allBtn) {
        state.vocabRevealStep = allBtn.dataset.vocabAll === '1' ? 99 : 0;
        renderVocabDetail();
        if (window.lucide) window.lucide.createIcons();
        return;
      }
      const senseBtn = e.target.closest('button[data-sense]');
      if (senseBtn) {
        state.activeSenseIdx = Number(senseBtn.dataset.sense);
        renderVocabDetail();
        if (window.lucide) window.lucide.createIcons();
        return;
      }
    });

    updateTimerUI();
    renderAll();
  </script>
</body>
</html>
